<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Compliance — audit and consent overview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1623"/>
      <stop offset="1" stop-color="#1a2c42"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C2A476"/>
      <stop offset="1" stop-color="#B08D57"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- shield -->
  <path d="M400 90 l120 40 v110 c0 90 -60 150 -120 180 c-60 -30 -120 -90 -120 -180 v-110 z" fill="#12233a" stroke="url(#gold)" stroke-width="3"/>
  <path d="M400 120 l90 30 v90 c0 70 -45 120 -90 145 c-45 -25 -90 -75 -90 -145 v-90 z" fill="#0B1623" stroke="#66704A" stroke-width="1.5"/>
  <path d="M372 250 l20 20 l40 -44" fill="none" stroke="#C9D8A8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- checklist -->
  <g stroke="url(#gold)" stroke-width="2" fill="none">
    <rect x="540" y="150" width="180" height="40" rx="8"/>
    <rect x="540" y="205" width="180" height="40" rx="8"/>
    <rect x="540" y="260" width="180" height="40" rx="8"/>
  </g>
  <g fill="#C9D8A8">
    <circle cx="565" cy="170" r="6"/>
    <circle cx="565" cy="225" r="6"/>
    <circle cx="565" cy="280" r="6"/>
  </g>
  <g fill="#66704A" opacity="0.7">
    <rect x="585" y="166" width="110" height="8" rx="4"/>
    <rect x="585" y="221" width="90" height="8" rx="4"/>
    <rect x="585" y="276" width="120" height="8" rx="4"/>
  </g>
  <!-- floor -->
  <line x1="0" y1="470" x2="800" y2="470" stroke="#66704A" stroke-width="2" opacity="0.5"/>
  <!-- laurel accents -->
  <g fill="none" stroke="#66704A" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M60 300 c-8 -4 -12 -12 -10 -20 c6 2 10 6 12 12"/>
    <path d="M58 306 c-10 -2 -16 -10 -14 -18 c6 2 10 8 12 14"/>
    <path d="M740 300 c8 -4 12 -12 10 -20 c-6 2 -10 6 -12 12"/>
    <path d="M742 306 c10 -2 16 -10 14 -18 c-6 2 -10 8 -12 14"/>
  </g>
  <text x="400" y="60" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="url(#gold)" letter-spacing="2">Compliance</text>
</svg>
