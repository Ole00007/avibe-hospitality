<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Smart Access — digital key and smart door lock">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1623"/>
      <stop offset="1" stop-color="#1a2c42"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C2A476"/>
      <stop offset="1" stop-color="#B08D57"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- door -->
  <rect x="120" y="60" width="300" height="410" rx="6" fill="#12233a" stroke="url(#gold)" stroke-width="3"/>
  <rect x="140" y="80" width="260" height="370" rx="4" fill="#1a2c42"/>
  <!-- door panels -->
  <rect x="160" y="110" width="220" height="120" rx="6" fill="#0B1623" stroke="#66704A" stroke-width="1.5"/>
  <rect x="160" y="250" width="220" height="120" rx="6" fill="#0B1623" stroke="#66704A" stroke-width="1.5"/>
  <!-- smart lock -->
  <rect x="360" y="250" width="46" height="70" rx="8" fill="#0B1623" stroke="url(#gold)" stroke-width="2.5"/>
  <circle cx="383" cy="272" r="10" fill="none" stroke="#C9D8A8" stroke-width="2.5"/>
  <path d="M383 272 l-4 4 l7 7" fill="none" stroke="#C9D8A8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- phone with digital key -->
  <rect x="520" y="150" width="120" height="230" rx="16" fill="#12233a" stroke="url(#gold)" stroke-width="2.5"/>
  <rect x="532" y="162" width="96" height="206" rx="10" fill="#0B1623"/>
  <rect x="560" y="172" width="40" height="6" rx="3" fill="#66704A"/>
  <circle cx="580" cy="230" r="26" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <path d="M570 230 l7 7 l14 -16" fill="none" stroke="#C9D8A8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="548" y="280" width="64" height="8" rx="4" fill="#66704A" opacity="0.6"/>
  <rect x="548" y="296" width="48" height="8" rx="4" fill="#66704A" opacity="0.4"/>
  <!-- signal between phone and lock -->
  <g fill="none" stroke="#66704A" stroke-width="1.5" opacity="0.8">
    <path d="M470 250 q30 -20 50 0"/>
    <path d="M470 270 q30 -20 50 0"/>
  </g>
  <!-- floor -->
  <line x1="0" y1="470" x2="800" y2="470" stroke="#66704A" stroke-width="2" opacity="0.5"/>
  <!-- laurel accents -->
  <g fill="none" stroke="#66704A" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M60 300 c-8 -4 -12 -12 -10 -20 c6 2 10 6 12 12"/>
    <path d="M58 306 c-10 -2 -16 -10 -14 -18 c6 2 10 8 12 14"/>
    <path d="M740 300 c8 -4 12 -12 10 -20 c-6 2 -10 6 -12 12"/>
    <path d="M742 306 c10 -2 16 -10 14 -18 c-6 2 -10 8 -12 14"/>
  </g>
  <text x="400" y="60" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="url(#gold)" letter-spacing="2">Smart Access</text>
</svg>
