<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Hotel Agent OS — agentic operations dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1623"/>
      <stop offset="1" stop-color="#1a2c42"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C2A476"/>
      <stop offset="1" stop-color="#B08D57"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- dashboard screen -->
  <rect x="120" y="110" width="560" height="330" rx="14" fill="#12233a" stroke="url(#gold)" stroke-width="2.5"/>
  <rect x="140" y="130" width="520" height="290" rx="8" fill="#0B1623" stroke="#66704A" stroke-width="1.5"/>
  <!-- header bar -->
  <rect x="140" y="130" width="520" height="40" rx="8" fill="#1a2c42"/>
  <circle cx="165" cy="150" r="6" fill="#9E3B32"/>
  <circle cx="185" cy="150" r="6" fill="#B08D57"/>
  <circle cx="205" cy="150" r="6" fill="#66704A"/>
  <!-- panels -->
  <rect x="160" y="190" width="150" height="90" rx="8" fill="#1a2c42" stroke="#66704A" stroke-width="1.5"/>
  <rect x="325" y="190" width="150" height="90" rx="8" fill="#1a2c42" stroke="#66704A" stroke-width="1.5"/>
  <rect x="490" y="190" width="150" height="90" rx="8" fill="#1a2c42" stroke="#66704A" stroke-width="1.5"/>
  <rect x="160" y="300" width="150" height="90" rx="8" fill="#1a2c42" stroke="#66704A" stroke-width="1.5"/>
  <rect x="325" y="300" width="150" height="90" rx="8" fill="#1a2c42" stroke="#66704A" stroke-width="1.5"/>
  <rect x="490" y="300" width="150" height="90" rx="8" fill="#1a2c42" stroke="#66704A" stroke-width="1.5"/>
  <!-- sparklines -->
  <g fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round">
    <path d="M170 260 l20 -14 l20 8 l20 -18 l20 10 l20 -6 l20 12"/>
    <path d="M335 260 l20 -10 l20 6 l20 -16 l20 12 l20 -4 l20 8"/>
    <path d="M500 260 l20 -12 l20 10 l20 -8 l20 14 l20 -6 l20 4"/>
  </g>
  <g fill="none" stroke="#66704A" stroke-width="2" stroke-linecap="round">
    <path d="M170 370 l20 -8 l20 6 l20 -12 l20 10 l20 -4 l20 8"/>
    <path d="M335 370 l20 -10 l20 8 l20 -6 l20 12 l20 -8 l20 4"/>
    <path d="M500 370 l20 -6 l20 10 l20 -12 l20 8 l20 -10 l20 6"/>
  </g>
  <!-- laurel accents -->
  <g fill="none" stroke="#66704A" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M60 300 c-8 -4 -12 -12 -10 -20 c6 2 10 6 12 12"/>
    <path d="M58 306 c-10 -2 -16 -10 -14 -18 c6 2 10 8 12 14"/>
    <path d="M740 300 c8 -4 12 -12 10 -20 c-6 2 -10 6 -12 12"/>
    <path d="M742 306 c10 -2 16 -10 14 -18 c-6 2 -10 8 -12 14"/>
  </g>
  <text x="400" y="60" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="url(#gold)" letter-spacing="2">Hotel Agent OS</text>
</svg>
