<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Smart Travel Wall — vending wall and lockers in a hotel lobby">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1623"/>
      <stop offset="1" stop-color="#1a2c42"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C2A476"/>
      <stop offset="1" stop-color="#B08D57"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- wall of lockers -->
  <g stroke="url(#gold)" stroke-width="2" fill="#12233a">
    <rect x="120" y="120" width="180" height="150" rx="8"/>
    <rect x="310" y="120" width="180" height="150" rx="8"/>
    <rect x="500" y="120" width="180" height="150" rx="8"/>
    <rect x="120" y="280" width="180" height="150" rx="8"/>
    <rect x="310" y="280" width="180" height="150" rx="8"/>
    <rect x="500" y="280" width="180" height="150" rx="8"/>
  </g>
  <!-- locker handles -->
  <g fill="url(#gold)">
    <rect x="270" y="200" width="14" height="6" rx="3"/>
    <rect x="460" y="200" width="14" height="6" rx="3"/>
    <rect x="650" y="200" width="14" height="6" rx="3"/>
    <rect x="270" y="360" width="14" height="6" rx="3"/>
    <rect x="460" y="360" width="14" height="6" rx="3"/>
    <rect x="650" y="360" width="14" height="6" rx="3"/>
  </g>
  <!-- vending glass on center column -->
  <rect x="330" y="140" width="140" height="110" rx="6" fill="#0B1623" stroke="#66704A" stroke-width="1.5"/>
  <rect x="340" y="150" width="120" height="90" rx="4" fill="#1a2c42"/>
  <g fill="url(#gold)" opacity="0.9">
    <rect x="350" y="160" width="30" height="30" rx="4"/>
    <rect x="390" y="160" width="30" height="30" rx="4"/>
    <rect x="350" y="200" width="30" height="30" rx="4"/>
    <rect x="390" y="200" width="30" height="30" rx="4"/>
  </g>
  <!-- floor -->
  <line x1="0" y1="470" x2="800" y2="470" stroke="#66704A" stroke-width="2" opacity="0.5"/>
  <!-- laurel accents -->
  <g fill="none" stroke="#66704A" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M60 300 c-8 -4 -12 -12 -10 -20 c6 2 10 6 12 12"/>
    <path d="M58 306 c-10 -2 -16 -10 -14 -18 c6 2 10 8 12 14"/>
    <path d="M740 300 c8 -4 12 -12 10 -20 c-6 2 -10 6 -12 12"/>
    <path d="M742 306 c10 -2 16 -10 14 -18 c-6 2 -10 8 -12 14"/>
  </g>
  <text x="400" y="60" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="url(#gold)" letter-spacing="2">Smart Travel Wall</text>
</svg>
